[project]
name = "ali-express"
version = "0.1.0"
description = "Calculates the ideal distribution of students"
readme = "README.MD"
authors = [{ name = "Sjoerd Cornelissen"}]
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "python-dotenv==1.2.2",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "jinja2==3.1.6",
    "matplotlib==3.10.0",
    "plotly==6.1.2",
    "networkx==3.5",
    "ipykernel==6.19.0",
    "nbformat==5.10.4",
    "pandera==0.25.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-login>=0.6.3",
    "flask-limiter>=4.1.1",
    "zxcvbn>=4.5.0",
    # Pinned exactly: a version bump may pick a different (equally optimal)
    # degenerate representative, which would shift the pinned integration values.
    "ortools==9.15.6755",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "black==25.1.0",
    "pre-commit==4.2.0",
    "isort==6.0.1",
    "pylint==3.3.7",
    "faker==37.6.0",
    "pytest-playwright==0.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ali-express = "aliexpress.main:main"
aliexpress = "aliexpress.main:main"

[tool.pytest.ini_options]
addopts = "--cov=aliexpress --cov=app --cov-report=term-missing --cov-report=xml -m 'not slow'"
markers = [
    "slow: long-running solver acceptance tests; skipped by default, pre-merge only",
]
pythonpath = ["."]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, '.')"

[tool.pylint."VARIABLES"]
good-names = ["M"]

[tool.pylint.format]
# The wizard blueprint (wizard.py) holds the full step-by-step distribution flow in one
# cohesive module; the herindelen-met-doorzetten variant adds several routes. We accept a
# larger module here rather than split the wizard flow prematurely; revisit with a blueprint
# split (see ADR-0012) if it keeps growing.
max-module-lines = 1200
